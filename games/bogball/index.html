<style>
:root{
  --ink:#231f3d; --ink2:#35305c; --edge:#140f2b; --cream:#fff4dc; --muted:#b9b1d9;
  --coral:#ff7a59; --gold:#ffd166; --grass:#86cf7a; --opp:#4fa3ff;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:#bfe4f0;overflow:hidden;color:var(--cream);
  font-family:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.px{font-family:"Pixelify Sans","Courier New",monospace}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;
  display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;pointer-events:none;z-index:3}
.plate{background:var(--ink);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);
  padding:6px 9px 8px;display:grid;gap:4px;width:min(280px,100%);box-sizing:border-box}
.plate.right{justify-self:end}
.plate .tm{font:700 13px/1.1 "Pixelify Sans",monospace;letter-spacing:.07em;text-transform:uppercase;
  display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.plate .tm b{display:inline-block;width:10px;height:10px;flex:none;border:2px solid var(--edge)}
.row{display:grid;grid-template-columns:72px 1fr 26px;gap:6px;align-items:center;font-size:12px;font-weight:800}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .num{font:500 11px "Pixelify Sans",monospace;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.hp{height:9px;background:#15122a;position:relative;overflow:hidden;border:1px solid #0d0a1e}
.hp i{position:absolute;left:0;top:0;bottom:0;display:block;background:#7be07b;transition:width .25s steps(6)}
.hp::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,#15122a 6px 7px)}
.row.out{opacity:.4}.row.out .nm{text-decoration:line-through}
.row.ctl .nm{color:var(--coral)}
#badge{background:var(--cream);color:var(--ink);border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);
  padding:5px 12px 6px;text-align:center;min-width:0}
#badge .rnd{font:700 16px/1 "Pixelify Sans",monospace;letter-spacing:.08em}
#badge .vs{font-size:11px;font-weight:800;margin-top:3px;white-space:nowrap}

/* floating text + banner */
#fx{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.ft{position:absolute;transform:translate(-50%,-50%);font:700 18px "Pixelify Sans",monospace;color:var(--cream);
  text-shadow:2px 2px 0 var(--edge),-1px -1px 0 var(--edge),1px -1px 0 var(--edge),-1px 1px 0 var(--edge);white-space:nowrap}
.ft.dmg{color:#ff6b6b;font-size:20px}.ft.sup{color:var(--gold);font-size:22px}.ft.catch{color:#8ff0ff}
.ft.ko{color:var(--cream);font-size:26px}
#banner{position:fixed;left:0;right:0;top:40%;text-align:center;z-index:5;pointer-events:none;
  font:700 clamp(40px,9vw,88px)/1 "Pixelify Sans",monospace;color:var(--gold);letter-spacing:.04em;
  text-shadow:5px 5px 0 var(--edge),-2px -2px 0 var(--edge),2px -2px 0 var(--edge),-2px 2px 0 var(--edge)}
#banner.pop{animation:pop .45s steps(5)}
@keyframes pop{0%{transform:scale(2.2);opacity:0}60%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}

/* screens */
#screen{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:16px;box-sizing:border-box;
  background:rgba(35,31,61,.42)}
.card{background:var(--ink);border:3px solid var(--edge);box-shadow:8px 8px 0 var(--edge);
  width:min(600px,100%);max-height:calc(100% - 8px);overflow:auto;box-sizing:border-box;padding:22px 24px 24px}
.logo{margin:0;font:700 clamp(40px,10vw,68px)/.9 "Pixelify Sans",monospace;letter-spacing:.02em;color:var(--cream);
  text-shadow:4px 4px 0 var(--coral),8px 8px 0 var(--edge)}
.logo span{display:block;color:var(--gold);text-shadow:4px 4px 0 #b1573f,8px 8px 0 var(--edge)}
.ed{margin:12px 0 0;font:500 13px "Pixelify Sans",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--coral)}
.sub{margin:14px 0 0;color:var(--muted);font-weight:800;font-size:14px;max-width:48ch}
.card h2{margin:0;font:700 clamp(30px,7vw,46px)/1 "Pixelify Sans",monospace;color:var(--gold);text-wrap:balance;
  text-shadow:3px 3px 0 var(--edge)}
.card h3{margin:20px 0 8px;font:700 12px "Pixelify Sans",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bracket{display:grid;gap:6px}
.br{display:grid;grid-template-columns:auto 12px 1fr auto;gap:10px;align-items:center;background:var(--ink2);
  padding:8px 10px;font-weight:800;font-size:14px;border-left:4px solid transparent}
.br .r{font:700 12px "Pixelify Sans",monospace;color:var(--muted);letter-spacing:.06em}
.br .sw{width:12px;height:12px;border:2px solid var(--edge)}
.br .lv{font:500 12px "Pixelify Sans",monospace;color:var(--muted)}
.br.now{border-left-color:var(--coral);background:#403a6d}
.br.done{opacity:.55}.br.done .lv{color:var(--grass)}
.squad{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:800;font-size:14px}
.squad em{font-style:normal;color:var(--muted);font-weight:700}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px;font-size:13px;font-weight:800}
.keys div{display:flex;gap:6px;align-items:center}
kbd{font:500 12px "Pixelify Sans",monospace;background:var(--cream);color:var(--ink);padding:2px 6px 3px;
  border-bottom:3px solid #b9ad92;min-width:12px;text-align:center}
.tip{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--cream);background:#403a6d;padding:8px 10px;
  border-left:4px solid var(--gold)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn{font:700 20px "Pixelify Sans",monospace;letter-spacing:.04em;background:var(--coral);color:var(--ink);
  border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);padding:9px 18px 10px;cursor:pointer}
.btn.alt{background:var(--cream)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.btn:focus-visible,#mute:focus-visible,#pauseBtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.stats{display:grid;grid-template-columns:1fr auto auto;gap:4px 18px;font-weight:800;font-size:14px;margin-top:6px}
.stats .h{font:700 11px "Pixelify Sans",monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.stats .v{font:700 16px "Pixelify Sans",monospace;text-align:right;font-variant-numeric:tabular-nums}
.lead{margin:10px 0 0;font-weight:800;color:var(--muted)}

/* corner buttons */
.corner{position:fixed;z-index:7;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:38px;height:38px;
  background:var(--ink);color:var(--cream);border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge);
  font:700 16px "Pixelify Sans",monospace;cursor:pointer;display:grid;place-items:center;padding:0}
#mute{right:16px}#pauseBtn{right:62px}
#mute.off{color:#6d6694;text-decoration:line-through}
#legend{position:fixed;left:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);z-index:3;pointer-events:none;
  display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:800;color:var(--ink);max-width:calc(100% - 140px)}
#legend span{display:flex;gap:5px;align-items:center;background:rgba(255,244,220,.82);padding:2px 7px 2px 3px}
#legend kbd{font-size:11px;padding:1px 5px 2px;background:var(--ink);color:var(--cream);border-bottom-color:#000}

/* touch */
#touch{display:none}
body.touch #touch{display:block}
body.touch #legend{display:none}
#stick{position:fixed;z-index:6;left:calc(16px + env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  width:132px;height:132px;border-radius:50%;background:rgba(35,31,61,.35);border:3px solid rgba(20,15,43,.55);touch-action:none}
#nub{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:var(--cream);border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge)}
#tbtns{position:fixed;z-index:6;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 60px);
  display:grid;grid-template-columns:repeat(2,64px);gap:10px}
#tbtns button{width:64px;height:64px;border-radius:50%;border:3px solid var(--edge);box-shadow:0 4px 0 var(--edge);
  font:700 12px/1.05 "Pixelify Sans",monospace;color:var(--ink);background:var(--cream);touch-action:none;padding:0}
#tbtns button[data-k="a"]{background:var(--coral)}
#tbtns button[data-k="jump"]{background:var(--gold)}
#tbtns button.on{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}

#rotate{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 118px);z-index:3;text-align:center;
  pointer-events:none;font:700 12px "Pixelify Sans",monospace;color:var(--ink);letter-spacing:.05em}
#rotate span{background:rgba(255,244,220,.85);padding:3px 8px}

@media (max-width:620px){
  #hud{gap:6px;padding-left:10px;padding-right:10px}
  .plate{padding:5px 6px 6px}
  .plate .tm{font-size:10px}
  .row{grid-template-columns:42px 1fr;font-size:10px;gap:4px}
  .row .num{display:none}
  #badge{padding:4px 6px}
  #badge .rnd{font-size:12px}
  #badge .vs{display:none}
  .card{padding:18px 16px 20px}

@media (prefers-reduced-motion:reduce){#banner.pop{animation:none}.hp i{transition:none}}

const parts = [], PGEO = new THREE.SphereGeometry(1, 6, 5);
function spawn(pos, color, n, speed, life, size, grav = 8, geo = PGEO) {
  for (let i = 0; i < n; i++) {
    let p = parts.find(q => q.life <= 0);
    if (!p) {
      if (parts.length > 260) return;
      p = { mesh: new THREE.Mesh(PGEO, new THREE.MeshBasicMaterial({ transparent: true, depthWrite: false })), vel: V(), life: 0 };
      scene.add(p.mesh); parts.push(p);
    }
    p.mesh.geometry = geo; p.mesh.visible = true; p.mesh.material.color.setHex(color);
    p.mesh.position.copy(pos);
    const th = Math.random() * Math.PI * 2, ph = Math.random() * Math.PI;
    p.vel.set(Math.sin(ph) * Math.cos(th), Math.abs(Math.cos(ph)) * .8 + .3, Math.sin(ph) * Math.sin(th)).multiplyScalar(speed * rand(.5, 1));
    p.life = p.max = life * rand(.7, 1.1); p.size = size; p.grav = grav;
  }
}
function updateParts(dt) {
  for (const p of parts) {
    if (p.life <= 0) continue;
    p.life -= dt;
    if (p.life <= 0) { p.mesh.visible = false; continue; }
    p.vel.y -= p.grav * dt; p.mesh.position.addScaledVector(p.vel, dt);
    const k = p.life / p.max; p.mesh.scale.setScalar(p.size * (.4 + .6 * k)); p.mesh.material.opacity = Math.min(1, k * 1.6);

function syncChar(c, dt) {

  body.rotation.set(0, 0, 0); body.position.set(0, 0, 0); M.root.scale.setScalar(1);
  const moving = Math.hypot(c.vel.x, c.vel.z) > .5 && onGround(c) && !busy(c);
  let sy = 1 + Math.sin(t * 4) * .035;
  const holding = S.ball.state === "held" && S.ball.holder === c;
  // arms

  armPose(.05, .5 + Math.sin(t * 4) * .02, .58);

  if (holding) armPose(.38, .64, .32);

  if (c.act === "catch") { body.rotation.z = .12; armPose(.5, .62, .26); }

}

  } else if (S.mode === "ko") {
    S.koT += dt; update(dt * (S.koT < .9 ? .35 : 1));
    if (S.koT > 2.4) showResult();
  }
  if (S.mode !== "pause") {
    for (const c of S.chars) syncChar(c, dt);
    syncBall(dt); syncCtrl(); updateParts(dt); updateFloats(dt);
    for (const g of stands) g.position.y = g.position.y - (g.userData.by || 0) + (g.userData.by = Math.abs(Math.sin(S.t * 3 + g.userData.ph)) * (S.mode === "ko" ? .5 : .12));
  }
  updateHud(); updateCamera(dt);
  renderer.render(scene, camera);
  for (const k in pressed) pressed[k] = false;
}

layout();
showTitle();
requestAnimationFrame(frame);
})();
</script>
